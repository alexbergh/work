apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # Security context на уровне pod (CIS 5.2.5, 5.2.6, 5.7.2)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999           # MongoDB user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      
      # Service account с минимальными правами
      automountServiceAccountToken: false
      
      containers:
      - name: mongodb
        image: mongo:7.0.14      # Фиксированная версия вместо latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
          protocol: TCP
        
        # Security context на уровне контейнера (CIS 5.2.2, 5.2.4, 5.2.7/5.2.8)
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: false  # MongoDB требует запись
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        
        # Ресурсные ограничения
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        
        # Probes для мониторинга
        livenessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-persistent-storage
      - name: tmp
        emptyDir: {}
