apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      # Security context на уровне pod (CIS K8s v1.12)
      securityContext:
        runAsNonRoot: true          # 5.2.7 - Запуск от непривилегированного пользователя
        runAsUser: 10001            # Явное указание UID
        runAsGroup: 10001           # Явное указание GID
        fsGroup: 10001              # Группа для файловой системы
        supplementalGroups: [10001]
        fsGroupChangePolicy: OnRootMismatch  # Оптимизация смены владельца томов
        seccompProfile:
          type: RuntimeDefault      # 5.7.2 - Seccomp профиль
      
      containers:
      - name: my-app-container
        image: my-app-image
        ports:
        - containerPort: 8080
          protocol: TCP
        
        # Security context на уровне контейнера
        securityContext:
          allowPrivilegeEscalation: false  # 5.2.6 - Запрет повышения привилегий
          privileged: false                # 5.2.2 - Не привилегированный контейнер
          readOnlyRootFilesystem: true     # Только чтение корневой ФС
          runAsNonRoot: true               # 5.2.7 - Дополнительная защита
          capabilities:
            drop:
              - ALL                        # 5.2.9 - Сброс всех capabilities
            # add:                         # Добавлять только необходимые
            #   - NET_BIND_SERVICE         # Пример: если нужен доступ к портам < 1024
        
        # Ресурсные ограничения
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        
        # Проверки работоспособности
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
