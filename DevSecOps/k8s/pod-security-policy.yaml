# Замена устаревшему PodSecurityPolicy (policy/v1beta1 удалён в Kubernetes 1.25+)
# Реализовано через ValidatingAdmissionPolicy + CEL (Kubernetes 1.30+)
# Соответствует CIS Kubernetes Benchmark v1.12 (контроль 5.2)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restricted-pod-security
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: allContainers
    expression: |
      object.spec.containers +
      (has(object.spec.initContainers) ? object.spec.initContainers : []) +
      (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
  - expression: "object.spec.hostPID != true"
    message: "hostPID must be false (CIS K8s v1.12 5.2.3)"
  - expression: "object.spec.hostIPC != true"
    message: "hostIPC must be false (CIS K8s v1.12 5.2.4)"
  - expression: "object.spec.hostNetwork != true"
    message: "hostNetwork must be false (CIS K8s v1.12 5.2.5)"
  - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
    message: "hostPath volumes are not allowed (CIS K8s v1.12 5.2.11)"
  - expression: |
      variables.allContainers.all(c,
        !has(c.securityContext) ||
        !has(c.securityContext.privileged) ||
        c.securityContext.privileged == false)
    message: "Privileged containers are not allowed (CIS K8s v1.12 5.2.2)"
  - expression: |
      variables.allContainers.all(c,
        has(c.securityContext) &&
        has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false)
    message: "allowPrivilegeEscalation must be false (CIS K8s v1.12 5.2.6)"
  - expression: |
      (has(object.spec.securityContext) &&
       has(object.spec.securityContext.runAsNonRoot) &&
       object.spec.securityContext.runAsNonRoot == true) ||
      variables.allContainers.all(c,
        has(c.securityContext) &&
        has(c.securityContext.runAsNonRoot) &&
        c.securityContext.runAsNonRoot == true)
    message: "runAsNonRoot must be true (CIS K8s v1.12 5.2.7)"
  - expression: |
      variables.allContainers.all(c,
        has(c.securityContext) &&
        has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) &&
        'ALL' in c.securityContext.capabilities.drop)
    message: "containers must drop ALL capabilities (CIS K8s v1.12 5.2.9)"
  - expression: |
      variables.allContainers.all(c,
        !has(c.securityContext) ||
        !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) ||
        c.securityContext.capabilities.add.all(cap, cap == 'NET_BIND_SERVICE'))
    message: "only NET_BIND_SERVICE capability may be added (CIS K8s v1.12 5.2.8/5.2.9)"
  - expression: |
      variables.allContainers.all(c,
        !has(c.ports) ||
        c.ports.all(p, !has(p.hostPort)))
    message: "hostPort is not allowed (CIS K8s v1.12 5.2.12)"
  - expression: |
      variables.allContainers.all(c,
        !has(c.securityContext) ||
        !has(c.securityContext.readOnlyRootFilesystem) ||
        c.securityContext.readOnlyRootFilesystem == true)
    message: "readOnlyRootFilesystem is required"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restricted-pod-security-binding
spec:
  policyName: restricted-pod-security
  validationActions: ["Deny"]
